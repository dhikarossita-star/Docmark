<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<title>DocMark Diagonal</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#20242a}
.app{padding:16px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:40px;height:40px;border-radius:11px;background:#20242a;color:#fff;display:grid;place-items:center;font-weight:800}
h1{font-size:18px;margin:0}.sub{font-size:12px;color:#667085;margin:2px 0 0}
.card{background:#fff;border:1px solid #e3e7ed;border-radius:14px;padding:14px}
label{display:block;font-size:13px;font-weight:700;margin:5px 0 6px}
input,textarea{width:100%;border:1px solid #ccd3dc;border-radius:10px;padding:11px;font:inherit;margin-bottom:12px}
button{width:100%;border:0;border-radius:10px;padding:11px;font-weight:700;margin-top:8px;background:#eceff3}
.primary{background:#20242a;color:#fff}.danger{background:#fff0f0;color:#9b1c1c}
.status{font-size:12px;line-height:1.4;background:#eef8f1;border-radius:9px;padding:10px;margin:12px 0 0}
.build{font-size:11px;color:#667085;text-align:center;margin-top:10px}
</style>
</head>
<body>
<main class="app">
  <div class="brand"><div class="logo">D</div><div><h1>DocMark Diagonal</h1><p class="sub">FINAL build 10.07</p></div></div>
  <section class="card">
    <label>Watermark</label>
    <input id="watermark" value="TERBATAS" maxlength="60">
    <label>Header</label>
    <textarea id="header" rows="3" placeholder="Contoh: KONSEP / BIRO PROTOKOL"></textarea>
    <button class="primary" id="watermarkOnly">Pasang Watermark</button>
    <button id="headerOnly">Pasang Header</button>
    <button class="danger" id="removeWatermark">Hapus Watermark</button>
    <p id="status" class="status">FINAL build aktif.</p>
  </section>
  <div class="build">DOCMARK-DIAGONAL-FINAL-1007</div>
</main>
<script>
/* global Office, Word */
const WM_TITLE="DOCMARK_DIAGONAL_FINAL";
const HDR_TITLE="DOCMARK_HEADER_FINAL";

Office.onReady(info=>{
  if(info.host!==Office.HostType.Word){status("Khusus Microsoft Word.",true);return;}
  document.getElementById("watermarkOnly").onclick=applyWatermark;
  document.getElementById("headerOnly").onclick=applyHeader;
  document.getElementById("removeWatermark").onclick=removeWatermark;
  status("FINAL build aktif — siap.");
});

function status(s,err=false){
 const e=document.getElementById("status"); e.textContent=s;
 e.style.background=err?"#fff0f0":"#eef8f1";
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function png(text){
 const c=document.createElement("canvas"); c.width=1800;c.height=1800;
 const x=c.getContext("2d"); x.clearRect(0,0,1800,1800);
 x.save();x.translate(900,900);x.rotate(-45*Math.PI/180);
 x.textAlign="center";x.textBaseline="middle";
 x.fillStyle="rgba(145,145,145,0.24)";
 let f=300;
 while(f>110){x.font=`700 ${f}px Arial`; if(x.measureText(text).width<1450)break; f-=10;}
 x.fillText(text,0,0);x.restore();
 return c.toDataURL("image/png").split(",")[1];
}

function ooxml(b64){
 const n=(Date.now()%100000000)+1, cx=6858000, cy=6858000;
 return `<pkg:package xmlns:pkg="http://schemas.microsoft.com/office/2006/xmlPackage">
 <pkg:part pkg:name="/_rels/.rels" pkg:contentType="application/vnd.openxmlformats-package.relationships+xml"><pkg:xmlData>
 <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
 <Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
 </Relationships></pkg:xmlData></pkg:part>
 <pkg:part pkg:name="/word/_rels/document.xml.rels" pkg:contentType="application/vnd.openxmlformats-package.relationships+xml"><pkg:xmlData>
 <Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
 <Relationship Id="rIdImg" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/wm.png"/>
 </Relationships></pkg:xmlData></pkg:part>
 <pkg:part pkg:name="/word/media/wm.png" pkg:contentType="image/png" pkg:compression="store"><pkg:binaryData>${b64}</pkg:binaryData></pkg:part>
 <pkg:part pkg:name="/word/document.xml" pkg:contentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"><pkg:xmlData>
 <w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"
 xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"
 xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"
 xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"
 xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">
 <w:body><w:p><w:r><w:drawing>
 <wp:anchor distT="0" distB="0" distL="0" distR="0" simplePos="0" relativeHeight="0" behindDoc="1" locked="0" layoutInCell="1" allowOverlap="1">
 <wp:simplePos x="0" y="0"/>
 <wp:positionH relativeFrom="page"><wp:align>center</wp:align></wp:positionH>
 <wp:positionV relativeFrom="page"><wp:align>center</wp:align></wp:positionV>
 <wp:extent cx="${cx}" cy="${cy}"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:wrapNone/>
 <wp:docPr id="${n}" name="DocMark Diagonal"/>
 <wp:cNvGraphicFramePr><a:graphicFrameLocks noChangeAspect="1"/></wp:cNvGraphicFramePr>
 <a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic>
 <pic:nvPicPr><pic:cNvPr id="0" name="wm.png"/><pic:cNvPicPr><a:picLocks noChangeAspect="1"/></pic:cNvPicPr></pic:nvPicPr>
 <pic:blipFill><a:blip r:embed="rIdImg"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>
 <pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:noFill/><a:ln><a:noFill/></a:ln></pic:spPr>
 </pic:pic></a:graphicData></a:graphic>
 </wp:anchor></w:drawing></w:r></w:p></w:body></w:document>
 </pkg:xmlData></pkg:part></pkg:package>`;
}

async function headers(ctx){
 const s=ctx.document.sections;s.load("items");await ctx.sync();
 const out=[];for(const sec of s.items){
   out.push(sec.getHeader(Word.HeaderFooterType.primary));
   out.push(sec.getHeader(Word.HeaderFooterType.firstPage));
   out.push(sec.getHeader(Word.HeaderFooterType.evenPages));
 }return out;
}

async function del(ctx,b,title){
 const q=b.contentControls.getByTitle(title);q.load("items");await ctx.sync();
 for(const c of q.items)c.delete(false);if(q.items.length)await ctx.sync();
}

async function applyWatermark(){
 const t=document.getElementById("watermark").value.trim();if(!t){status("Isi watermark dulu.",true);return;}
 status("Memasang watermark diagonal...");
 try{
  const b64=png(t);
  await Word.run(async ctx=>{
    const hs=await headers(ctx);
    for(const h of hs){
      await del(ctx,h,WM_TITLE);
      const r=h.insertOoxml(ooxml(b64),Word.InsertLocation.end);
      const cc=r.insertContentControl();cc.title=WM_TITLE;cc.tag=WM_TITLE;cc.appearance=Word.ContentControlAppearance.hidden;
      await ctx.sync();
    }
  });
  status("BERHASIL — watermark diagonal FINAL dipasang.");
 }catch(e){console.error(e);status("ERROR: "+(e.message||e),true);}
}

async function applyHeader(){
 const t=document.getElementById("header").value.trim();
 try{
  await Word.run(async ctx=>{
   const hs=await headers(ctx);
   for(const h of hs){
    await del(ctx,h,HDR_TITLE);
    if(t){
      const p=h.insertParagraph(t,Word.InsertLocation.start);p.alignment=Word.Alignment.right;
      const r=p.getRange();r.font.name="Arial";r.font.size=9;r.font.italic=true;r.font.color="#999999";
      const cc=r.insertContentControl();cc.title=HDR_TITLE;cc.tag=HDR_TITLE;cc.appearance=Word.ContentControlAppearance.hidden;
      await ctx.sync();
    }
   }
  });status("Header dipasang.");
 }catch(e){status("ERROR: "+(e.message||e),true);}
}

async function removeWatermark(){
 try{
  await Word.run(async ctx=>{const hs=await headers(ctx);for(const h of hs)await del(ctx,h,WM_TITLE);});
  status("Watermark FINAL dihapus.");
 }catch(e){status("ERROR: "+(e.message||e),true);}
}
</script>
</body></html>
